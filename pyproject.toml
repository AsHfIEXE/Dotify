[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dotify-cli"
version = "3.0.0+custom.4"
description = "A command-line app for downloading songs, podcasts and videos from Spotify with smart environment management."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

dependencies = [
    "async-lru>=2.1.0",
    "click>=8.3.1",
    "colorama>=0.4.6",
    "dataclass-click>=1.0.4",
    "httpx>=0.28.1",
    "httpx-retries>=0.4.6",
    "inquirerpy>=0.3.4",
    "mutagen>=1.47.0",
    "pillow>=12.1.0",
    "protobuf>=6.33.5",
    "pybase62>=1.0.0",
    "pycryptodome>=3.23.0",
    "pyfreedom>=0.1.0,<0.2",
    "pywidevine>=1.9.0",
    "rich>=13.9.0",
    "unplayplay>=0.0.2",
    "yt-dlp>=2026.2.4",
]

[project.urls]
repository = "https://github.com/AsHfIEXE/Dotify"

[project.scripts]
dotify = "dotify.cli.cli:cli"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.setuptools.package-data]
dotify = ["py.typed"]

[tool.setuptools.packages.find]
include = ["dotify*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "performance: lightweight performance regression budgets",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "B"]
